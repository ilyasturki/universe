<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Universe og:image</title>
        <link rel="stylesheet" href="base.css">
        <style>
        .card {
            background: radial-gradient(60% 80% at 80% 50%, rgb(255 163 72 / 0.14), transparent 70%), var(--bg);
        }
        .shot {
            position: absolute;
            left: 560px;
            top: 70px;
            width: 1000px;
            height: 562.5px;
            border-radius: 18px;
            border: 1px solid var(--line);
            box-shadow: 0 30px 80px rgb(0 0 0 / 0.6);
        }
        .text {
            position: absolute;
            left: 64px;
            top: 0;
            bottom: 0;
            width: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lockup {
            width: 400px;
            height: auto;
            margin-left: -6px;
        }
        h1 {
            margin-top: 40px;
            font-size: 42px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.015em;
            text-wrap: balance;
        }
        .url {
            margin-top: 32px;
        }
        </style>
    </head>
    <body>
        <div class="card">
            <img class="shot" src="assets/look-universe.webp" alt="">
            <div class="text">
                <img class="lockup" src="../../brand/universe-lockup-dark.svg" alt="Universe">
                <h1>A game launcher for Linux you drive with a controller.</h1>
                <div class="url">universe.ilyasturki.com</div>
            </div>
        </div>
    </body>
</html>
