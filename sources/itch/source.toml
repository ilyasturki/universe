api = 2
id = "itch"
name = "itch.io"
version = "0.0.9"
description = "Installs and updates the games you own on itch.io through butler, and adopts the itch app's installs."
exe = "bin/source"
capabilities = ["uninstall"]

[requires]
bins = ["butler"]

[login]
kind = "key"
hint = "Open the link, generate an API key, then enter it."

[[settings]]
key = "games_dir"
type = "path"
default = ""
label = "Install folder"
description = "Empty installs into the library's games folder."

[[settings]]
key = "platform"
type = "enum"
default = "linux"
label = "Build to install when a game has both"
choice_labels = { linux = "Linux", windows = "Windows" }
choices = ["linux", "windows"]

[[settings]]
key = "db_path"
type = "path"
default = ""
label = "butler's database"
description = "Empty keeps the source's own."
advanced = true

[[settings]]
key = "adopt_from"
type = "path"
default = "~/.config/itch/db/butler.db"
label = "Adopt installs from"
description = "The itch app's database; a scan takes over the install folders it lists."
advanced = true

[[settings]]
key = "install_timeout_s"
type = "int"
default = 7200
label = "Install time limit"
description = "In seconds; a longer install or update is stopped."
advanced = true
