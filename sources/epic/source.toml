api = 2
id = "epic"
name = "Epic Games"
version = "0.0.9"
description = "Installs and updates the games of your Epic Games account through legendary; lists their achievements."
exe = "bin/source"
capabilities = ["achievements", "uninstall"]

[requires]
bins = ["legendary"]

[[tools]]
id = "legendary"
name = "legendary-gl"
kind = "tool"
bin = "legendary"
homepage = "https://github.com/legendary-gl/legendary"
builds = [{ version = "0.21.1", assets = [{ format = "binary", url = "https://github.com/legendary-gl/legendary/releases/download/0.21.1/legendary_linux_x64", sha256 = "dbed33bbe96031e65858233e4badf0a1d401bb6cb0cc995d1237cf3a0c826a45" }] }]

[login]
hint = "Sign in at the link, then enter the authorizationCode the page shows, or the whole page."

[hooks]
pre-launch   = "bin/pre-launch"
post-process = "bin/post-process"
timeout_s    = 40

[[settings]]
key = "achievements"
type = "bool"
default = true
label = "Achievements"
description = "Fetched from Epic after each session."
scope = "game"

[[settings]]
key = "games_dir"
type = "path"
default = ""
label = "Install folder"
description = "Empty installs into the library's games folder."

[[settings]]
key = "with_dlcs"
type = "bool"
default = true
label = "Install owned DLCs"

[[settings]]
key = "anticheat_runtimes"
type = "bool"
default = true
label = "Anti-cheat runtimes"
description = "Easy Anti-Cheat and BattlEye for Proton, fetched from Lutris."
advanced = true

[[settings]]
key = "config_path"
type = "path"
default = "~/.config/legendary"
label = "legendary's folder"
description = "Where legendary keeps its login and installed games."
advanced = true

[[settings]]
key = "adopt_from"
type = "path"
default = "~/.config/heroic/legendaryConfig/legendary"
label = "Adopt installs from"
description = "Another legendary's folder, Heroic's by default, whose installs a scan takes over."
advanced = true

[[settings]]
key = "install_timeout_s"
type = "int"
default = 7200
label = "Install time limit"
description = "In seconds; a longer install or update is stopped."
advanced = true
