api = 2
id = "steam"
name = "Steam"
version = "0.0.11"
description = "Runs the games of your Steam library itself, with the Steam client in the background; installs them through Steam's window and reads their achievements."
exe = "bin/source"
capabilities = ["achievements", "uninstall"]

[requires]
bins = ["steam"]

[login]
kind = "key"
hint = "With Steam signed in on this machine, open the link, register a key (any domain name will do), then enter it."
purpose = "list the games you own"

[hooks]
pre-launch   = "bin/pre-launch"
post-process = "bin/post-process"
timeout_s    = 90

[[settings]]
key = "achievements"
type = "bool"
default = true
label = "Achievements"
description = "Read from Steam after each session."
scope = "game"

[[settings]]
key = "shared_prefix"
type = "bool"
default = true
label = "Share Steam's prefix"
description = "Games added from now on run in Steam's own prefix, with their saves."

[[settings]]
key = "steam_root"
type = "path"
default = ""
label = "Steam's folder"
description = "Empty takes the one Steam uses."
advanced = true

[[settings]]
key = "confirm_timeout_s"
type = "int"
default = 600
label = "Install confirm time"
description = "In seconds, to confirm an install in Steam's window."
advanced = true

[[settings]]
key = "install_timeout_s"
type = "int"
default = 14400
label = "Install time limit"
description = "In seconds; a longer install or update is stopped."
advanced = true
