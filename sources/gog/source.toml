api = 2
id = "gog"
name = "GOG"
version = "0.0.10"
description = "Installs and updates the games of your GOG account through gogdl; unlocks their achievements through comet."
exe = "bin/source"
capabilities = ["achievements", "cloud-saves"]

[requires]
bins = ["gogdl"]

[[tools]]
id = "gogdl"
name = "heroic-gogdl"
kind = "tool"
bin = "gogdl"
homepage = "https://github.com/Heroic-Games-Launcher/heroic-gogdl"
builds = [{ version = "1.3.0", assets = [{ format = "binary", url = "https://github.com/Heroic-Games-Launcher/heroic-gogdl/releases/download/v1.3.0/gogdl_linux_x86_64", sha256 = "cba013d42767c808237c437335ab1d56f58405d07e8f37b3324d264ea5c49655" }] }]

[login]
hint = "Sign in at the link. The address it lands on ends in code=…: enter what follows code=, or the whole address."

[hooks]
pre-launch   = "bin/pre-launch"
post-launch  = "bin/post-launch"
session-end  = "bin/session-end"
post-process = "bin/post-process"
check        = "bin/check"
timeout_s    = 40

[[settings]]
key = "achievements"
type = "bool"
default = true
label = "Achievements"
description = "Comet stands in for GOG Galaxy, so games unlock theirs."
scope = "game"

[[settings]]
key = "cloud_saves"
type = "bool"
default = false
label = "Cloud saves"
description = "Saves come down from GOG before a session and go up after it."
keywords = ["cloud", "sync", "saves"]
scope = "game"

[[settings]]
key = "games_dir"
type = "path"
default = ""
label = "Install folder"
description = "Empty installs into the library's games folder."
keywords = ["install folder", "directory"]

[[settings]]
key = "scan_dirs"
type = "string"
default = ""
label = "Scanned folders"
description = "Comma-separated; empty scans the install folder."
keywords = ["scan", "folders", "detect"]
advanced = true

[[settings]]
key = "platform"
type = "enum"
default = "windows"
label = "Depot platform"
description = "The depot gogdl downloads; a Windows build runs through Proton."
keywords = ["windows", "linux", "depot"]
choice_labels = { windows = "Windows", linux = "Linux" }
choices = ["windows", "linux"]

[[settings]]
key = "with_dlcs"
type = "bool"
default = true
label = "Install owned DLCs"
description = "Installs the DLCs you own along with the game."
keywords = ["dlc", "expansions", "addons"]

[[settings]]
key = "auth_path"
type = "path"
default = "~/.config/gogdl/auth.json"
label = "gogdl token file"
description = "The token file gogdl writes at login."
advanced = true

[[settings]]
key = "install_timeout_s"
type = "int"
default = 7200
label = "Install time limit"
description = "In seconds; a longer install or update is stopped."
advanced = true
