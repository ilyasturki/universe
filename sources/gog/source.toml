api = 2
id = "gog"
name = "GOG"
version = "0.0.5"
description = "Installs and updates the games of your GOG account through gogdl."
exe = "bin/source"

[requires]
bins = ["gogdl"]

[[settings]]
key = "games_dir"
type = "path"
default = ""
label = "Install folder (empty: paths.games_root)"

[[settings]]
key = "scan_dirs"
type = "string"
default = ""
label = "Scanned folders (comma-separated, empty: the install folder)"
advanced = true

[[settings]]
key = "platform"
type = "enum"
default = "windows"
label = "Depot platform"
choices = ["windows", "linux"]

[[settings]]
key = "with_dlcs"
type = "bool"
default = true
label = "Install owned DLCs"

[[settings]]
key = "auth_path"
type = "path"
default = "~/.config/gogdl/auth.json"
label = "gogdl token file"
advanced = true

[[settings]]
key = "install_timeout_s"
type = "int"
default = 7200
label = "Maximum install or update time (s)"
advanced = true
