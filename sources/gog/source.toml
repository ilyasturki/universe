api = 2
id = "gog"
name = "GOG"
version = "0.0.7"
description = "Installs and updates the games of your GOG account through gogdl; unlocks their achievements through comet."
exe = "bin/source"
capabilities = ["achievements"]

[requires]
bins = ["gogdl"]

[hooks]
pre-launch   = "bin/pre-launch"
post-launch  = "bin/post-launch"
session-end  = "bin/session-end"
post-process = "bin/post-process"
timeout_s    = 40

[[settings]]
key = "achievements"
type = "bool"
default = true
label = "Achievements (comet stands in for GOG Galaxy)"
scope = "game"

[[settings]]
key = "games_dir"
type = "path"
default = ""
label = "Install folder (empty: paths.games_root)"

[[settings]]
key = "scan_dirs"
type = "string"
default = ""
label = "Scanned folders (comma-separated, empty: the install folder)"
advanced = true

[[settings]]
key = "platform"
type = "enum"
default = "windows"
label = "Depot platform"
choices = ["windows", "linux"]

[[settings]]
key = "with_dlcs"
type = "bool"
default = true
label = "Install owned DLCs"

[[settings]]
key = "auth_path"
type = "path"
default = "~/.config/gogdl/auth.json"
label = "gogdl token file"
advanced = true

[[settings]]
key = "install_timeout_s"
type = "int"
default = 7200
label = "Maximum install or update time (s)"
advanced = true
