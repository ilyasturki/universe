name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix build .#checks.x86_64-linux.lint .#checks.x86_64-linux.rust-lint --no-link -L
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # The two Rust derivations take ~9 min cold; a push that touches no Rust substitutes them from the cache
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix build .#universe .#universe-ui --no-link -L
      # The lint job builds the two lint checks; listing the rest keeps this job from compiling the Rust tree twice
      - run: nix build .#checks.x86_64-linux.pytest-ui .#checks.x86_64-linux.pytest-modules .#checks.x86_64-linux.pytest-sources .#checks.x86_64-linux.pytest-core-py --no-link -L
      - run: nix flake check --no-build
