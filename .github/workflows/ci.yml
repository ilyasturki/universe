name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
      - run: nix build .#checks.x86_64-linux.lint .#checks.x86_64-linux.rust-lint --no-link -L
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # The Rust derivations are slow cold (~9 min for the core's two); a push that touches no Rust finds them in the last run's store.
      # One cache entry for the store: magic-nix-cache's per-path calls get throttled by the Actions cache.
      - id: nix-cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-build-${{ github.sha }}
          restore-prefixes-first-match: nix-build-
      # The out-links are gc roots: the save's garbage collection keeps what they point to
      - run: nix build .#universe .#universe-ui .#universe-desktop -o "$RUNNER_TEMP/package" -L
      # The docs' fake takes played offscreen on the built UI: a take whose keys no longer reach their screen fails here
      - run: tools/docs-media dry-run && tools/docs-media check
        env:
          UI_BIN: ${{ runner.temp }}/package-1/bin/universe-ui
      # The lint job builds the two lint checks; listing the rest keeps this job from compiling the Rust tree twice
      - run: nix build .#checks.x86_64-linux.pytest-ui .#checks.x86_64-linux.pytest-modules .#checks.x86_64-linux.pytest-sources .#checks.x86_64-linux.pytest-core-py .#checks.x86_64-linux.desktop-test -o "$RUNNER_TEMP/check" -L
      - run: nix flake check --no-build
      # 5G keeps the toolchain and the vendored crates beside the gc roots; the purge keeps one entry per branch inside the repo's 10 GB
      - if: always() && steps.nix-cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-build-${{ github.sha }}
          gc-max-store-size-linux: 5G
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-build-
          purge-created: 0
          purge-primary-key: never
  # Off NixOS: the core's tests, tools/dist, install.sh, the CLI and the UI offscreen, as a user other than root
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "ubuntu:24.04", "fedora:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-deps
      - id: rustc
        run: echo "version=$(runuser -u ci -- env HOME=/home/ci rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # After ci-deps made the ci user: useradd leaves a home that already exists to root
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /home/ci/.cargo/registry
            /home/ci/.cargo/git
            target
            !target/distro-check
          key: cargo-${{ matrix.image }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.image }}-${{ steps.rustc.outputs.version }}-
      - run: chown -R ci . /home/ci
      # No debug info or incremental state: most of a debug target dir, which each run would upload and download
      - run: runuser -u ci -- env HOME=/home/ci CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 tools/distro-check
      - if: always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /home/ci/.cargo/registry
            /home/ci/.cargo/git
            target
            !target/distro-check
          key: cargo-${{ matrix.image }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
  # Each desktop profile started without a GPU: windows, cursor, OSD and shots
  desktops:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-deps desktops
      - run: chown -R ci .
      - run: runuser -u ci -- env HOME=/home/ci tools/desktop-smoke
