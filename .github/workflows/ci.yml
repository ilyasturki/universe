name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
      - run: nix build .#checks.x86_64-linux.lint .#checks.x86_64-linux.rust-lint --no-link -L
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # The Rust derivations are slow cold (~9 min for the core's two); a push that touches no Rust substitutes them from the cache
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
      - run: nix build .#universe .#universe-ui .#universe-desktop --no-link -L
      # The lint job builds the two lint checks; listing the rest keeps this job from compiling the Rust tree twice
      - run: nix build .#checks.x86_64-linux.pytest-ui .#checks.x86_64-linux.pytest-modules .#checks.x86_64-linux.pytest-sources .#checks.x86_64-linux.pytest-core-py --no-link -L
      - run: nix flake check --no-build
  # Off NixOS: the core's tests, tools/dist, install.sh, the CLI and the UI offscreen, as a user other than root
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "ubuntu:24.04", "fedora:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-deps
      - run: chown -R ci .
      - run: runuser -u ci -- env HOME=/home/ci tools/distro-check
  # Each desktop profile started without a GPU: windows, cursor, OSD and shots
  desktops:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci-deps desktops
      - run: chown -R ci .
      - run: runuser -u ci -- env HOME=/home/ci tools/desktop-smoke
  # Consumers follow their own nixpkgs, not this lock: evaluation only against today's newest stable and unstable heads
  nixpkgs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, unstable]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: |
          if [ "${{ matrix.channel }}" = unstable ]; then
            branch=nixos-unstable
          else
            branch=$(git ls-remote --heads https://github.com/NixOS/nixpkgs 'nixos-*' | grep -oE 'nixos-[0-9]{2}\.[0-9]{2}$' | sort -V | tail -1)
          fi
          echo "Evaluating against $branch"
          nix build .#universe .#universe-ui .#universe-desktop .#universe-fhs --dry-run --override-input nixpkgs "github:NixOS/nixpkgs/$branch"
