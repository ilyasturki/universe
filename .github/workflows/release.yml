name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  notes:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Notes from CHANGELOG.md
        run: |
          tools/changelog check "${GITHUB_REF_NAME#v}"
          tools/changelog notes "${GITHUB_REF_NAME#v}" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "Universe ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
  # GTK 4.22 and libadwaita 1.9 are no older distro's: Universe Desktop is built on Arch, for the systems that have them
  desktop:
    needs: notes
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - run: pacman -Sy --noconfirm archlinux-keyring > /dev/null && pacman -Su --noconfirm --needed base-devel rust glib2-devel gtk4 libadwaita blueprint-compiler > /dev/null
      - run: UNIVERSE_GIT_REV="${GITHUB_SHA::7}" cargo build --release --locked -p universe-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: universe-desktop
          path: target/release/universe-desktop
  # Outside Nix, whose outputs are not relocatable; 22.04's glibc 2.35 is the oldest the binary then asks for, in a container since its runner image is being retired
  dist:
    needs: [notes, desktop]
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    # a container's default shell is sh, dash on ubuntu
    defaults:
      run:
        shell: bash
    steps:
      - run: apt-get update -q && apt-get install -qy --no-install-recommends build-essential ca-certificates curl git scdoc > /dev/null
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # 22.04's own Python is 3.10
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv --seed --python 3.11 "$RUNNER_TEMP/py"
      - uses: actions/download-artifact@v8
        with:
          name: universe-desktop
          path: desktop
      - run: chmod +x desktop/universe-desktop
      - run: UNIVERSE_GIT_REV="${GITHUB_SHA::7}" UNIVERSE_DESKTOP_BIN=desktop/universe-desktop PYTHON="$RUNNER_TEMP/py/bin/python" tools/dist "dist/universe-${GITHUB_REF_NAME#v}"
      - run: tar -C dist -czf universe-x86_64-linux.tar.gz "universe-${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: universe-x86_64-linux.tar.gz
  # gh is not in the 22.04 container
  upload:
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - run: gh release upload "$GITHUB_REF_NAME" universe-x86_64-linux.tar.gz install.sh
        env:
          GH_TOKEN: ${{ github.token }}
  aur:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: grep -qx "pkgver=${GITHUB_REF_NAME#v}" packaging/aur/universe/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: universe
          pkgbuild: packaging/aur/universe/PKGBUILD
          updpkgsums: true
          commit_username: Ilyas Turki
          commit_email: turki.ilyass@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ github.ref_name }}
          force_push: true
  # The COPR project builds with the network on (cargo fetches the crates), for Fedora 44 and newer: older ones ship a PySide6 under 6.11
  copr:
    needs: notes
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - run: 'grep -Eqx "Version: +${GITHUB_REF_NAME#v}" packaging/rpm/universe.spec'
      - run: dnf install -y -q copr-cli rpm-build rpmdevtools > /dev/null
      - run: spectool --get-files --all --directory . packaging/rpm/universe.spec
      - run: rpmbuild -bs --define "_sourcedir $PWD" --define "_srcrpmdir $PWD" packaging/rpm/universe.spec
      # COPR_CONFIG is the ~/.config/copr that copr.fedorainfracloud.org/api hands out; its token lasts 180 days
      # the project keeps an unbuilt rawhide chroot only so "Follow Fedora branching" forks each new Fedora from it
      - run: |
          printf '%s\n' "$COPR_CONFIG" > "$RUNNER_TEMP/copr"
          copr-cli --config "$RUNNER_TEMP/copr" build --exclude-chroot fedora-rawhide-x86_64 universe universe-*.src.rpm
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
  aur-bin:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: grep -qx "pkgver=${GITHUB_REF_NAME#v}" packaging/aur/universe-bin/PKGBUILD
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: universe-bin
          pkgbuild: packaging/aur/universe-bin/PKGBUILD
          updpkgsums: true
          commit_username: Ilyas Turki
          commit_email: turki.ilyass@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ github.ref_name }}
          force_push: true
