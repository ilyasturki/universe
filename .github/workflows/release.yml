name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: tools/release-notes "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
  # Outside Nix, whose outputs are not relocatable; 22.04's glibc 2.35 is the oldest the binary then asks for
  dist:
    needs: notes
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: rustup update stable --no-self-update && rustup default stable
      - run: sudo apt-get install -y scdoc
      - run: tools/dist "dist/universe-${GITHUB_REF_NAME#v}"
      - run: tar -C dist -czf universe-x86_64-linux.tar.gz "universe-${GITHUB_REF_NAME#v}"
      - run: gh release upload "$GITHUB_REF_NAME" universe-x86_64-linux.tar.gz install.sh
        env:
          GH_TOKEN: ${{ github.token }}
