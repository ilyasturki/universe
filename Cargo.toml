[workspace]
members = ["crates/universe", "crates/universe-py"]
# universe-py is built by maturin against the venv interpreter; a bare cargo build would rebuild pyo3 with another
default-members = ["crates/universe"]
resolver = "2"

[workspace.package]
version = "0.0.3"
edition = "2021"
license = "MIT"

[profile.release]
strip = true
lto = "thin"
