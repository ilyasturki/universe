[package]
name = "universe-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Universe Desktop: the mouse-and-keyboard GTK frontend of the Universe game launcher"

[dependencies]
universe = { path = "../universe" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
tracing = "0.1"
unicode-normalization = "0.1"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"
