[package]
name = "universe-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings to the Universe core (the host UI links these)"

[lib]
name = "universe_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pythonize = "0.29"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
universe = { path = "../universe" }
