[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universe_ui"
version = "0.0.5"
description = "Gamepad-first launcher UI for Universe (PySide6 host; the Reprise and Switch 2 looks)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.11", "pysdl2", "qrcode"]

[project.scripts]
universe-ui = "universe_ui.host:main"

[tool.setuptools.packages.find]
include = ["universe_ui*"]

[tool.setuptools.package-data]
universe_ui = ["qml/**/*", "fixtures/*.json", "fixtures/power_supply/*/*"]
