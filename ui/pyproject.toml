[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universe_ui"
version = "0.1.0"
description = "Gamepad-first launcher UI for Universe (PySide6 host around the Reprise theme)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.11", "pysdl2", "qrcode"]

[project.scripts]
universe-ui = "universe_ui.__main__:main"

[tool.setuptools.packages.find]
include = ["universe_ui*"]

[tool.setuptools.package-data]
universe_ui = ["qml/**/*", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
