[tool.pytest.ini_options]
testpaths = ["ui/tests", "modules", "sources", "crates/universe-py/tests"]
pythonpath = ["ui"]

[tool.ruff]
line-length = 160
target-version = "py311"
include = ["*.py", "*.pyi", "**/pyproject.toml", "modules/*/bin/*", "sources/*/bin/*", "tools/release-notes"]
extend-exclude = ["modules/capture/bin/thaw"]

[tool.ruff.lint]
select = [
  "F", "E4", "E7", "E9", "W", "I", "UP", "B", "SIM", "C4", "PIE", "FURB", "PERF", "FLY", "RUF",
  "PLE", "PLW", "PLC", "ASYNC", "LOG", "G", "T10", "EXE", "YTT", "BLE", "PYI", "TC", "ISC", "PGH", "FA",
]
# No DTZ: the journal's session ids are naive local time by contract. RUF001-003: the strings carry typographic marks and CJK punctuation on purpose.
ignore = ["E731", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["universe_ui", "universe_core"]

[tool.pyright]
include = [
  "conftest.py",
  "ui/universe_ui",
  "modules/capture/bin",
  "modules/journal/bin",
  "sources/gog/bin",
  "crates/universe-py/typings",
  "tools/release-notes",
]
exclude = ["**/__pycache__"]
stubPath = "crates/universe-py/typings"
pythonVersion = "3.11"
typeCheckingMode = "basic"
# universe_core is a compiled extension: the stub is its only source
reportMissingModuleSource = false
