[tool.pytest.ini_options]
testpaths = ["ui/tests", "modules", "extension", "sources", "crates/universe-py/tests"]
pythonpath = ["ui"]
markers = ["slow: allowed past the 2 s a test is held to (conftest.py)"]
# The thread method: a hang inside Qt's C++ never hands Python the signal method's alarm.
timeout = 60
timeout_method = "thread"
qt_api = "pyside6"
qt_log_level_fail = "WARNING"
qt_log_ignore = [
  # No sound server in CI or the Nix sandbox.
  "QSoundEffect: playback of this format is not supported",
  "No audio device detected",
  "PulseAudioService: pa_context_connect\\(\\) failed",
  "Couldn't (load|resolve) pipewire-0\\.3",
  # The fixture's store rows carry GOG's own image URLs; the sandbox has no network.
  "QML Image: .*images\\.gog-statics\\.com",
]

[tool.ruff]
line-length = 160
target-version = "py311"
include = ["*.py", "*.pyi", "**/pyproject.toml", "modules/*/bin/*", "sources/*/bin/*", "tools/release-notes", "tools/catalogue"]
extend-exclude = ["modules/capture/bin/thaw", "modules/pads/bin/thaw"]

[tool.ruff.lint]
select = [
  "F", "E4", "E7", "E9", "W", "I", "UP", "B", "SIM", "C4", "PIE", "FURB", "PERF", "FLY", "RUF",
  "PLE", "PLW", "PLC", "ASYNC", "LOG", "G", "T10", "EXE", "YTT", "BLE", "PYI", "TC", "ISC", "PGH", "FA",
]
# No DTZ: the journal's session ids are naive local time by contract. RUF001-003: the strings carry typographic marks and CJK punctuation on purpose.
ignore = ["E731", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["universe_ui", "universe_core"]

[tool.pyright]
include = [
  "conftest.py",
  "ui/universe_ui",
  "modules/capture/bin",
  "modules/screenshot/bin",
  "modules/journal/bin",
  "modules/pads/bin",
  "modules/controls/bin",
  "sources/gog/bin",
  "sources/epic/bin",
  "sources/itch/bin",
  "sources/steam/bin",
  "crates/universe-py/typings",
  "tools/release-notes",
  "tools/catalogue",
]
exclude = ["**/__pycache__"]
stubPath = "crates/universe-py/typings"
pythonVersion = "3.11"
typeCheckingMode = "basic"
# universe_core is a compiled extension: the stub is its only source
reportMissingModuleSource = false
