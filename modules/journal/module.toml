api = 2
id = "journal"
name = "Play journal"
version = "0.0.10"
description = "After each session, a model writes an entry from the recording, when Video capture is on, and from the screenshots you took. A session with neither gets no entry."

[requires]
bins = ["ffmpeg"]

[hooks]
post-process = "bin/process"
check        = "bin/check"
timeout_s    = 20

[limits]
cpu_weight  = 20
memory_high = "4G"

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Write a journal entry after each session"
description = "From the session's recording and screenshots."
scope = "game"

[[settings]]
key = "language"
type = "enum"
default = "auto"
label = "Entry language"
description = "Auto writes in the game's on-screen language."
keywords = ["locale", "french", "english"]
choice_labels = { auto = "Auto", fr = "French", en = "English", es = "Spanish", de = "German", it = "Italian", pt = "Portuguese", ja = "Japanese" }
scope = "game"
choices = ["auto", "fr", "en", "es", "de", "it", "pt", "ja"]

[[settings]]
key = "provider"
type = "enum"
default = ""
label = "Writing model"
description = "The provider that writes the entries."
keywords = ["openai", "codex", "claude", "model", "ai"]
choice_labels = { codex = "Codex", openai = "OpenAI-compatible API", stub = "Stub (no model)" }
scope = "global"
required = true
choices = ["codex", "openai", "stub"]
requires_bins = { codex = ["codex"] }

[[settings]]
key = "model"
type = "string"
default = ""
label = "Model"
description = "The model the provider is asked for."
keywords = ["gpt", "claude", "llm", "ai"]
scope = "global"
choices_exec = "bin/choices"

[[settings]]
key = "base_url"
type = "string"
default = "https://api.openai.com/v1"
label = "API endpoint"
description = "For the OpenAI-compatible API."
scope = "global"

[[settings]]
key = "api_key"
type = "string"
default = ""
label = "API key"
description = "For the OpenAI-compatible API."
scope = "global"

[[settings]]
key = "api_key_file"
type = "path"
default = ""
label = "API key file"
description = "Read in place of the API key."
scope = "global"

[[settings]]
key = "web_search"
type = "bool"
default = true
label = "Let the model look the game up on the web"
scope = "global"
advanced = true

[[settings]]
key = "effort"
type = "enum"
default = "high"
label = "Reasoning effort"
choice_labels = { minimal = "Minimal", low = "Low", medium = "Medium", high = "High" }
scope = "global"
advanced = true
choices = ["minimal", "low", "medium", "high"]

[[settings]]
key = "attempts"
type = "int"
default = 2
label = "Tries per session"
description = "Past them, the entry is put off."
scope = "global"
advanced = true

[[settings]]
key = "request_timeout_s"
type = "int"
default = 900
label = "Seconds a single try may take"
scope = "global"
advanced = true

[[settings]]
key = "max_images"
type = "int"
default = 40
label = "Maximum images sent to the model"
scope = "global"
advanced = true

[[settings]]
key = "frame_long_edge"
type = "int"
default = 1568
label = "Frame size"
description = "The long edge of the frames taken from the recording, in pixels."
scope = "global"
advanced = true

[[settings]]
key = "prompt_file"
type = "path"
default = ""
label = "Prompt file"
description = "Its text replaces the built-in writing prompt."
scope = "global"
advanced = true
