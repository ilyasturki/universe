api = 2
id = "journal"
name = "Play journal"
version = "0.0.4"
description = "After each session, a model writes an entry from the recording, when Video capture is on, and from the screenshots you took. A session with neither gets no entry."

[requires]
bins = ["ffmpeg", "codex"]

[hooks]
post-process = "bin/process"
timeout_s    = 20

[limits]
cpu_weight  = 20
memory_high = "4G"

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Write a journal entry after each session"
scope = "game"

[[settings]]
key = "language"
type = "enum"
default = "auto"
label = "Entry language (auto = the game's on-screen language)"
scope = "game"
choices = ["auto", "fr", "en", "es", "de", "it", "pt", "ja"]

[[settings]]
key = "provider"
type = "enum"
default = "codex"
label = "Writing model"
scope = "global"
choices = ["codex", "stub"]

[[settings]]
key = "model"
type = "string"
default = "gpt-5.6-sol"
label = "Model name passed to the provider"
scope = "global"
choices_exec = "bin/choices"

[[settings]]
key = "markdown_export"
type = "bool"
default = true
label = "Render the Markdown note for Obsidian"
scope = "global"

[[settings]]
key = "max_images"
type = "int"
default = 40
label = "Maximum images sent to the model"
scope = "global"
advanced = true
