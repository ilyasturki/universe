api = 2
id = "controls"
name = "Emulator controls"
version = "0.0.9"
description = "Sets up the emulator's controllers for you at every launch: each pad you hold becomes a player, mapped like the emulator would map it, and HOME, capture and the paddles stay Universe's. It replaces the controller settings made inside the emulator, so a change made there lasts one session; a game's own control profile is kept and moved to the pad you hold. To keep your own mapping, turn this off for that game."

[applies]
runner_kinds = ["emulator"]

[hooks]
pre-launch  = "bin/pre"
session-end = "bin/stop"
timeout_s   = 10

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Set up the emulator's controllers at launch (off: the emulator keeps its own)"
scope = "game"

[[settings]]
key = "layout"
type = "enum"
default = "positional"
label = "Nintendo face buttons (positional: A on the right, as on a Switch; xbox: A at the bottom)"
scope = "game"
choices = ["positional", "xbox"]
runners = ["eden", "ryujinx", "dolphin", "cemu", "azahar", "melonds", "mgba", "snes9x"]

[[settings]]
key = "wiimote"
type = "enum"
default = "nunchuk"
label = "Wii remote (nunchuk: upright with a nunchuk; sideways: held flat, D-pad and left stick move; classic: Classic Controller)"
scope = "game"
choices = ["nunchuk", "sideways", "classic"]
platforms = ["Nintendo Wii"]

[[settings]]
key = "shoulders"
type = "enum"
default = "standard"
label = "Shoulder buttons (standard: as the emulator maps them; swapped: bumpers and triggers exchanged, e.g. GameCube L/R on the bumpers and Z on the triggers)"
scope = "game"
choices = ["standard", "swapped"]
runners = ["eden", "ryujinx", "dolphin", "cemu", "azahar", "melonds", "mgba", "snes9x", "mupen64plus", "rpcs3", "pcsx2", "duckstation", "ppsspp"]

[[settings]]
key = "guide"
type = "bool"
default = false
label = "Give HOME to the emulator too (capture and paddles always stay Universe's)"
scope = "global"
