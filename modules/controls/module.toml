api = 2
id = "controls"
name = "Emulator controls"
version = "0.0.12"
description = "Maps the pads you hold to the emulator's players at every launch. HOME, capture and the back paddles stay Universe's."

[applies]
runner_kinds = ["emulator"]

[hooks]
pre-launch  = "bin/pre"
session-end = "bin/stop"
pads        = "bin/pads"
timeout_s   = 10

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Set up controllers"
description = "Map each pad you hold to a player at every launch. Off keeps the controller settings made in the emulator."
scope = "game"

[[settings]]
key = "layout"
type = "enum"
default = "pad"
label = "Nintendo button layout"
description = "Where A sits in Nintendo games, GameCube and Wii included. B, X and Y follow it. By default each controller keeps the one printed on it, or the one set for it in the controller settings."
choice_labels = { pad = "Each controller's own", positional = "A on the right, every controller", xbox = "A at the bottom, every controller" }
scope = "game"
choices = ["pad", "positional", "xbox"]
keywords = ["abxy", "swap", "face buttons"]
runners = ["eden", "ryujinx", "dolphin", "cemu", "azahar", "melonds", "mgba", "snes9x"]

[[settings]]
key = "wiimote"
type = "enum"
default = "nunchuk"
label = "Wii controller"
description = "The controller a Wii game expects. Most take the Nunchuk; 2D games like New Super Mario Bros. Wii hold the remote sideways."
choice_labels = { nunchuk = "Remote and Nunchuk", sideways = "Remote sideways", classic = "Classic Controller" }
scope = "game"
choices = ["nunchuk", "sideways", "classic"]
platforms = ["Nintendo Wii"]

[[settings]]
key = "shoulders"
type = "enum"
default = "standard"
label = "Triggers and bumpers"
description = "Swapped exchanges the two. GameCube L and R then sit on the bumpers, Z on the triggers."
choice_labels = { standard = "As on the console", swapped = "Swapped" }
keywords = ["swap", "shoulders", "zl", "zr", "l2", "r2"]
scope = "game"
choices = ["standard", "swapped"]
runners = ["eden", "ryujinx", "dolphin", "cemu", "azahar", "mupen64plus", "rpcs3", "pcsx2", "duckstation"]

[[settings]]
key = "guide"
type = "bool"
default = false
label = "Share HOME with the emulator"
description = "The emulator also gets HOME, for the console's own HOME or PS button. Universe's menu still opens on it."
scope = "global"
