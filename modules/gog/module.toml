api = 1
id = "gog"
name = "GOG"
kind = ["source"]
version = "0.1.0"

[requires]
core = ">=0.1"
bins = ["gogdl"]

[source]
exe = "bin/source"

[[settings]]
key = "games_dir"
type = "path"
default = "/mnt/games/PC"
label = "Install folder"
scope = "global"

[[settings]]
key = "scan_dirs"
type = "string"
default = "/mnt/games/PC,/mnt/games/gog"
label = "Scanned folders (comma-separated)"
scope = "global"

[[settings]]
key = "platform"
type = "enum"
default = "windows"
label = "Depot platform"
scope = "global"
choices = ["windows", "linux"]

[[settings]]
key = "with_dlcs"
type = "bool"
default = true
label = "Install owned DLCs"
scope = "global"

[[settings]]
key = "auth_path"
type = "path"
default = "~/.config/gogdl/auth.json"
label = "gogdl token file"
scope = "global"

[[settings]]
key = "install_timeout_s"
type = "int"
default = 7200
label = "Maximum install or update time (s)"
scope = "global"
