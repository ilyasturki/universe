api = 1
id = "gog"
name = "GOG"
kind = ["source"]
version = "0.0.2"

[requires]
bins = ["gogdl"]

[source]
exe = "bin/source"

[[settings]]
key = "games_dir"
type = "path"
default = ""
label = "Install folder (empty: paths.games_root)"
scope = "global"

[[settings]]
key = "scan_dirs"
type = "string"
default = ""
label = "Scanned folders (comma-separated, empty: the install folder)"
scope = "global"

[[settings]]
key = "platform"
type = "enum"
default = "windows"
label = "Depot platform"
scope = "global"
choices = ["windows", "linux"]

[[settings]]
key = "with_dlcs"
type = "bool"
default = true
label = "Install owned DLCs"
scope = "global"

[[settings]]
key = "auth_path"
type = "path"
default = "~/.config/gogdl/auth.json"
label = "gogdl token file"
scope = "global"

[[settings]]
key = "install_timeout_s"
type = "int"
default = 7200
label = "Maximum install or update time (s)"
scope = "global"
