api = 1
id = "tracker-md"
name = "Markdown tracker"
kind = ["hooks"]
version = "0.1.0"

[requires]
core = ">=0.1"
bins = []

[hooks]
session-end = "bin/sync"
timeout_s   = 10

[[settings]]
key = "root"
type = "path"
default = "~/Documents/universe"
label = "Markdown tracker root"
scope = "global"

[[settings]]
key = "create_missing"
type = "bool"
default = false
label = "Add a row to playing.md when the game has none"
scope = "global"

[[settings]]
key = "update_metadata"
type = "bool"
default = true
label = "Fill the missing fields in .data/games.json"
scope = "global"

[[settings]]
key = "journal_link"
type = "bool"
default = true
label = "Write the Journal link when the folder exists"
scope = "global"
