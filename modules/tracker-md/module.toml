api = 1
id = "tracker-md"
name = "Tracker Markdown"
kind = ["hooks"]
version = "0.1.0"

[requires]
core = ">=0.1"
bins = []

[hooks]
session-end = "bin/sync"
timeout_s   = 10

[[settings]]
key = "root"
type = "path"
default = "~/Documents/notes/games"
label = "Racine du tracker Markdown"
scope = "global"

[[settings]]
key = "create_missing"
type = "bool"
default = false
label = "Ajouter une ligne dans playing.md quand le jeu n'a aucune ligne"
scope = "global"

[[settings]]
key = "update_metadata"
type = "bool"
default = true
label = "Compléter .data/games.json avec les champs manquants"
scope = "global"

[[settings]]
key = "journal_link"
type = "bool"
default = true
label = "Écrire le lien Journal quand le dossier existe"
scope = "global"
