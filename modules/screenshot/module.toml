api = 2
id = "screenshot"
name = "Screenshots"
version = "0.0.9"
description = "Takes the screenshots asked for from the dock, a pad button or `universe screenshot`: gamescope's own inside the launcher's gamescope, else the desktop's (the GNOME extension, spectacle, grim, the X server); gpu-screen-recorder when neither can."

[hooks]
screenshot = "bin/shot"
timeout_s  = 20

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Take screenshots"
scope = "game"

[[settings]]
key = "window"
type = "bool"
default = true
label = "The game's window alone, not every monitor"
scope = "game"

[[settings]]
key = "cursor"
type = "bool"
default = false
label = "Show the cursor in screenshots"
scope = "game"
