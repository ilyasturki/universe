api = 1
id = "capture"
name = "Video capture"
kind = ["hooks"]
version = "0.1.0"

[requires]
core = ">=0.1"
bins = ["gpu-screen-recorder"]

[hooks]
post-launch = "bin/start"
session-end = "bin/stop"
screenshot  = "bin/shot"
timeout_s   = 20

[limits]
cpu_weight  = 100
memory_high = "4G"

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Record the session"
scope = "game"

[[settings]]
key = "cursor"
type = "bool"
default = false
label = "Show the cursor in the recording"
scope = "game"

[[settings]]
key = "codec"
type = "enum"
default = "av1_10bit"
label = "Video codec"
scope = "global"
choices = ["av1_10bit", "av1", "hevc", "h264"]

[[settings]]
key = "fps"
type = "int"
default = 60
label = "Frame rate (auto: the screen's)"
scope = "global"
choices = ["auto", "120", "90", "60", "30"]

[[settings]]
key = "audio"
type = "enum"
default = "output+input"
label = "Audio tracks captured"
scope = "global"
choices = ["output", "output+input", "none"]

[[settings]]
key = "min_duration_s"
type = "int"
default = 240
label = "Minimum duration kept (s)"
scope = "global"

[[settings]]
key = "quality"
type = "string"
default = "qvbr"
label = "Quality (qvbr, or raw ffmpeg video options)"
scope = "global"
choices = ["qvbr"]
