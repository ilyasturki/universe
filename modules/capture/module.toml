api = 2
id = "capture"
name = "Video capture"
version = "0.0.9"
description = "Records each session with gpu-screen-recorder; the Play journal draws its frames from the recording."

[requires]
bins = ["gpu-screen-recorder", "gsr-cli", "ffmpeg", "ffprobe", "trash"]

[hooks]
pre-launch  = "bin/pre"
post-launch = "bin/start"
freeze      = "bin/freeze"
thaw        = "bin/thaw"
session-end = "bin/stop"
timeout_s   = 20

[limits]
cpu_weight  = 100
memory_high = "4G"

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Record the session"
description = "Records every session of this game with gpu-screen-recorder."
scope = "game"

[[settings]]
key = "source"
type = "enum"
default = "screen"
label = "Capture"
description = "A window is picked once, in the desktop's dialog."
choice_labels = { screen = "The whole screen", window = "One window" }
scope = "game"
choices = ["screen", "window"]

[[settings]]
key = "cursor"
type = "bool"
default = false
label = "Show the cursor in the recording"
scope = "game"

[[settings]]
key = "codec"
type = "enum"
default = "auto"
label = "Video codec"
description = "Auto takes the best the GPU encodes; AV1 keeps files small."
choice_labels = { auto = "Auto", av1_10bit = "AV1 10-bit", av1 = "AV1", hevc_10bit = "HEVC 10-bit", hevc = "HEVC", h264 = "H.264" }
scope = "global"
choices = ["auto", "av1_10bit", "av1", "hevc_10bit", "hevc", "h264"]

[[settings]]
key = "quality"
type = "enum"
default = "very_high"
label = "Quality"
description = "Constant quality, held under a bitrate ceiling."
choice_labels = { medium = "Medium", high = "High", very_high = "Very high", ultra = "Ultra" }
scope = "global"
choices = ["medium", "high", "very_high", "ultra"]

[[settings]]
key = "fps"
type = "int"
default = 60
label = "Frame rate"
description = "Auto follows the screen's refresh rate."
choice_labels = { auto = "Auto" }
scope = "global"
choices = ["auto", "120", "90", "60", "30"]
choices_exec = "bin/choices"

[[settings]]
key = "size"
type = "string"
default = "native"
label = "Video size"
description = "The video is scaled down to fit; native keeps the screen's size."
choice_labels = { native = "Native" }
scope = "global"
choices = ["native", "3840x2160", "2560x1440", "1920x1080"]

[[settings]]
key = "container"
type = "enum"
default = "mkv"
label = "Container"
description = "MKV survives a crash; MP4 plays anywhere."
choice_labels = { mkv = "MKV", mp4 = "MP4" }
scope = "global"
choices = ["mkv", "mp4"]
advanced = true

[[settings]]
key = "audio"
type = "enum"
default = "output"
label = "Audio"
description = "Output is what the speakers play; the microphone gets a track of its own."
choice_labels = { output = "Output", "output+input" = "Output and microphone", none = "None" }
scope = "global"
choices = ["output", "output+input", "none"]

[[settings]]
key = "audio_codec"
type = "enum"
default = "opus"
label = "Audio codec"
choice_labels = { opus = "Opus", aac = "AAC", flac = "FLAC" }
scope = "global"
choices = ["opus", "aac", "flac"]
advanced = true

[[settings]]
key = "audio_bitrate"
type = "int"
default = "auto"
label = "Audio bitrate"
description = "In kbps; auto leaves it to gpu-screen-recorder."
choice_labels = { auto = "Auto" }
scope = "global"
choices = ["auto", "96", "128", "160", "192", "256", "320"]
advanced = true

[[settings]]
key = "min_duration_s"
type = "int"
default = 240
label = "Shortest recording kept"
description = "In seconds; a shorter recording is thrown away."
scope = "global"
advanced = true

[[settings]]
key = "window_wait_s"
type = "int"
default = 60
label = "Window wait"
description = "In seconds: how long the game's window may take before the pick. Past it, the screen is recorded."
scope = "global"
advanced = true

[[settings]]
key = "ffmpeg_video_opts"
type = "string"
default = ""
label = "FFmpeg video options"
description = "Passed to gpu-screen-recorder as -ffmpeg-video-opts, in place of the quality preset."
scope = "config"

[[settings]]
key = "gsr_extra_args"
type = "string"
default = ""
label = "Extra gpu-screen-recorder arguments"
description = "Appended to gpu-screen-recorder's command line."
scope = "config"
