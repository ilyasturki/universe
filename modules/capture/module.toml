api = 2
id = "capture"
name = "Video capture"
version = "0.0.3"
description = "Records each session with gpu-screen-recorder; the Play journal draws its frames from the recording."

[requires]
bins = ["gpu-screen-recorder", "gsr-cli", "ffprobe", "trash"]

[hooks]
pre-launch  = "bin/pre"
post-launch = "bin/start"
freeze      = "bin/freeze"
thaw        = "bin/thaw"
session-end = "bin/stop"
screenshot  = "bin/shot"
timeout_s   = 20

[limits]
cpu_weight  = 100
memory_high = "4G"

[[settings]]
key = "enabled"
type = "bool"
default = true
label = "Record the session"
scope = "game"

[[settings]]
key = "source"
type = "enum"
default = "screen"
label = "Capture (window: picked once in GNOME's dialog)"
scope = "game"
choices = ["screen", "window"]

[[settings]]
key = "cursor"
type = "bool"
default = false
label = "Show the cursor in the recording"
scope = "game"

[[settings]]
key = "codec"
type = "enum"
default = "av1_10bit"
label = "Video codec"
scope = "global"
choices = ["av1_10bit", "av1", "hevc", "h264"]

[[settings]]
key = "quality"
type = "enum"
default = "very_high"
label = "Quality (constant, up to a size ceiling)"
scope = "global"
choices = ["medium", "high", "very_high", "ultra"]

[[settings]]
key = "fps"
type = "int"
default = 60
label = "Frame rate (auto: the screen's)"
scope = "global"
choices = ["auto", "120", "90", "60", "30"]
choices_exec = "bin/choices"

[[settings]]
key = "size"
type = "string"
default = "native"
label = "Fit the video in (native: no scaling)"
scope = "global"
choices = ["native", "3840x2160", "2560x1440", "1920x1080"]

[[settings]]
key = "container"
type = "enum"
default = "mkv"
label = "Container (mkv survives a crash, mp4 plays anywhere)"
scope = "global"
choices = ["mkv", "mp4"]
advanced = true

[[settings]]
key = "audio"
type = "enum"
default = "output+input"
label = "Audio tracks captured"
scope = "global"
choices = ["output", "output+input", "none"]

[[settings]]
key = "audio_codec"
type = "enum"
default = "opus"
label = "Audio codec"
scope = "global"
choices = ["opus", "aac", "flac"]
advanced = true

[[settings]]
key = "audio_bitrate"
type = "int"
default = "auto"
label = "Audio bitrate (kbps)"
scope = "global"
choices = ["auto", "96", "128", "160", "192", "256", "320"]
advanced = true

[[settings]]
key = "min_duration_s"
type = "int"
default = 240
label = "Minimum duration kept (s)"
scope = "global"
advanced = true

[[settings]]
key = "window_wait_s"
type = "int"
default = 60
label = "Wait for the game's window (s) before the pick, then record the screen"
scope = "global"
advanced = true

[[settings]]
key = "ffmpeg_video_opts"
type = "string"
default = ""
label = "gpu-screen-recorder -ffmpeg-video-opts, replacing the quality preset"
scope = "config"

[[settings]]
key = "gsr_extra_args"
type = "string"
default = ""
label = "Extra gpu-screen-recorder arguments"
scope = "config"
